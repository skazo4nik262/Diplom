version: '3.8'
services:
  vpn:
    build: ./vpn-client
    container_name: vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./vpn/VPNTYPE-AMS5.ovpn:/vpn/vpn.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "test -d /sys/class/net/tun0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
#----------------------------------------------------------------
  vpn-proxy:
    image: gogost/gost:latest
    container_name: vpn-proxy
    restart: unless-stopped
    network_mode: service:vpn
    command: ["-L", "http://:8888"]
    depends_on:
      vpn:
        condition: service_started
#----------------------------------------------------------------
  vless-proxy:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: vless-proxy
    restart: unless-stopped
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ./sing-box-config.json:/etc/sing-box/config.json
    ports:
      - "1080:1080"
    depends_on:
      vpn:
        condition: service_started
#----------------------------------------------------------------
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    volumes:
      - D:/Jellyfin/config:/config
      - D:/Jellyfin/cache:/cache
      - D:/Jellyfin/media:/media
    ports:
      - "8096:8096"
    restart: unless-stopped
#----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: MyPostgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skazo4nik
      POSTGRES_PASSWORD: qaz123wsx
      POSTGRES_DB: mydb
    ports:
      - "54320:5432"
    volumes:
      - D:/Postgres/pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skazo4nik -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
#----------------------------------------------------------------
  catalog-service:
    build: ./Services/CatalogService/CatalogService
    container_name: catalog-service
    volumes:
      - D:/KinopoiskCacheImages:/cache/images
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=mydb;Username=skazo4nik;Password=qaz123wsx
      - Jwt__Key=your_very_long_secret_key_at_least_32_chars
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=JellyfinService
      - HTTP_PROXY=socks5://vless-proxy:1080
      - HTTPS_PROXY=socks5://vless-proxy:1080
      - http_proxy=socks5://vless-proxy:1080
      - https_proxy=socks5://vless-proxy:1080
      - DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER=1
      - TMDB_API_KEY=76ac486e8244a34f77259b927d1852e5
      - EmbeddingService__Url=http://embedding-service:5004
      - CacheImageService__Url=http://cache-image-service:5007
      - NO_PROXY=localhost,127.0.0.1,embedding-service,postgres,ollama,oclip,cache-image-service
    depends_on:
      vless-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      cache-image-service:
        condition: service_started
#----------------------------------------------------------------
  cache-image-service:
    build: ./Services/CacheImageService/CacheImageService
    container_name: cache-image-service
    volumes:
      - D:/KinopoiskCacheImages:/cache/images
    environment:
      - HTTP_PROXY=socks5://vless-proxy:1080
      - HTTPS_PROXY=socks5://vless-proxy:1080
      - http_proxy=socks5://vless-proxy:1080
      - https_proxy=socks5://vless-proxy:1080
      - DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER=1
      - NO_PROXY=localhost,127.0.0.1,identity-service,embedding-service,postgres,ollama,oclip,cache-image-service,catalog-service
#----------------------------------------------------------------
  blazor-web:
    build: ./Services/BlazorServerRenderKinopoisk/BlazorServerRenderKinopoisk
    container_name: blazor-web
    restart: unless-stopped
    ports:
      - "5044:5044"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5044
      - ApiClient__ApiUrl=http://api-gateway:5000
    depends_on:
      api-gateway:
        condition: service_started
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      jellyfin-service:
        condition: service_started
      admin-service:
        condition: service_started
      embedding-service:
        condition: service_started
      cache-image-service:
        condition: service_started
      postgres:
        condition: service_healthy
#----------------------------------------------------------------
  identity-service:
    build: ./Services/IdentityService/IdentityService
    container_name: identity-service
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=mydb;Username=skazo4nik;Password=qaz123wsx
      - Jwt__Key=your_very_long_secret_key_at_least_32_chars
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=JellyfinService
    depends_on:
      postgres:
        condition: service_healthy
#----------------------------------------------------------------
  jellyfin-service:
    build: ./Services/JellyfinService/JellyfinService
    container_name: jellyfin-service
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mydb;Username=skazo4nik;Password=qaz123wsx
      - Jwt__Key=your_very_long_secret_key_at_least_32_chars
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=JellyfinService
      - Jellyfin__Url=http://jellyfin:8096
      - Jellyfin__ApiKey=28176db7279d476d999a8600efde4b61
    depends_on:
      postgres:
        condition: service_healthy
      jellyfin:
        condition: service_started
#----------------------------------------------------------------
  api-gateway:
    build: ./Services/ApiGateway/ApiGateway
    container_name: api-gateway
    ports:
      - "5000:5000"  # единственный публичный вход
    environment:
      - Jwt__Key=your_very_long_secret_key_at_least_32_chars
      - Jwt__Issuer=IdentityService
      - Jwt__Audience=JellyfinService
    depends_on:
      - identity-service
      - jellyfin-service
      - admin-service
#----------------------------------------------------------------
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Vladivostok
      - TRANSMISSION_WEB_HOME=/combustion-release/
      - USER=transmission
      - PASS=transmission
    volumes:
      - D:/Jellyfin/config/transmission:/config
      - D:/Jellyfin/media/torrents:/downloads
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
#----------------------------------------------------------------
  admin-service:
    build: ./Services/AdminService/AdminService
    container_name: admin-service
    volumes:
      - D:/Jellyfin/media:/media
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mydb;Username=skazo4nik;Password=qaz123wsx
      - Jellyfin__Url=http://jellyfin:8096
      - Jellyfin__ApiKey=28176db7279d476d999a8600efde4b61
      - Transmission__Url=http://transmission:9091
      - Transmission__User=transmission
      - Transmission__Pass=transmission
    depends_on:
      postgres:
        condition: service_healthy
      jellyfin:
        condition: service_started
      transmission:
        condition: service_started
#----------------------------------------------------------------
  embedding-service:
    build: ./Services/EmbeddingService/EmbeddingService
    container_name: embedding-service
    ports:
      - "5004:5004"
    environment:
      - Ollama__Url=http://ollama:11434
      - Clip__Url=http://oclip:11435
    depends_on:
      ollama:
        condition: service_started
      oclip:
        condition: service_started
#----------------------------------------------------------------
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c", "ollama serve & sleep 2 && ollama pull nomic-embed-text && wait"]
#----------------------------------------------------------------
  oclip:
    image: ghcr.io/hoeflechner/oclip:main
    container_name: oclip
    restart: unless-stopped
    ports:
      - "11435:11435"
    environment:
      - MODELNAME=hf-hub:laion/CLIP-ViT-B-32-laion2B-s34B-b79K
      - DEVICE=cuda
      - TIMEOUT=300
    volumes:
      - clip_cache:/root/.cache/huggingface/hub/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
#----------------------------------------------------------------

volumes:
  ollama_data:
  clip_cache: